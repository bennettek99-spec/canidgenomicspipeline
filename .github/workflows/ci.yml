name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev + analysis extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Test
        run: pytest --cov=canidae --cov-report=term-missing

  parity:
    name: external parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up parity environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-parity.yml
          environment-name: canis-parity
          cache-environment: true
          init-shell: bash

      - name: Install CANIS
        shell: bash -el {0}
        run: micromamba run -n canis-parity pip install -e ".[dev,analysis]"

      - name: Run external parity tests
        shell: bash -el {0}
        run: micromamba run -n canis-parity pytest tests/integration/test_external_parity.py -m integration -v
