# Red wolf study starting from an ALREADY-CALLED joint VCF (e.g. you produced it in the
# cloud/WSL2, or someone shared one). This path is pure-Python and runs natively on Windows —
# no bioinformatics binaries needed. Point `callset` at your VCF and run:
#
#   canidae run -c configs/examples/redwolf_from_vcf.yaml ^
#     --set stages.ingest.callset=C:\path\to\joint.vcf.gz
#
# (The sample sheet is already wired to configs/examples/redwolf_samples.csv — its sample_id
#  column must match the sample names in the VCF.)

project_name: red-wolf-from-vcf
seed: 20

paths:
  root: .

executor:
  max_workers: 4
  resume: true

pipeline:
  - ingest            # registers the VCF + the sample sheet (both in one step)
  - load_genotypes
  - distance
  - pca
  - fst
  - diversity
  - admixture
  - cluster
  - nj_tree
  - f3
  - dstats
  - local_ancestry
  - demography
  - geography
  - report

stages:
  ingest:
    sample_sheet: configs/examples/redwolf_samples.csv
    callset: data/redwolf/joint.vcf.gz      # <-- override with --set stages.ingest.callset=...
  load_genotypes:
    biallelic_snps_only: true
    min_maf: 0.05
    max_missing: 0.2
  admixture:
    backend: nmf
    k_min: 2
    k_max: 6
  nj_tree:
    n_bootstrap: 100
  local_ancestry:
    sources: [coyote, gray_wolf]
    targets: [red_wolf, eastern_wolf]
    window_bp: 500000
  demography:
    mutation_rate: 4.5e-9
  report:
    title: "Red wolf ancestry — from a joint VCF (real public genomes)"
