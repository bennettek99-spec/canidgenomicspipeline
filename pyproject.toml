[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "canidae"
version = "0.2.0"
description = "CANIS — a publication-quality comparative evolutionary genomics platform for canids."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bennett Kuhn" }]
keywords = ["genomics", "population-genetics", "canids", "evolution", "introgression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core runtime deps are intentionally light: the foundation is pure-Python so it
# installs and tests anywhere. Heavy genomics stacks live in optional extras.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]

# `analysis` holds the pure-Python, wheel-installable stack the Phase 1 population-genomics
# and reporting stages need (no external bioinformatics binaries, installs on any OS).
analysis = [
    "scikit-allel>=1.3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "biopython>=1.83",  # Newick parsing + tree drawing for reports
    "msprime>=1.3",   # simulated cohorts for validation
]
# `genomics` holds the heavier htslib-backed stack used by the upstream processing stages
# (best installed via conda/bioconda on Linux).
genomics = [
    "cyvcf2>=0.30",
    "pysam>=0.22",
    "sgkit>=0.8",
    "zarr>=2.17",
    "dask[array]>=2024.1",
]
viz = [
    "seaborn>=0.13",
    "plotly>=5.19",
]
geo = ["geopandas>=0.14", "cartopy>=0.22", "shapely>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.scripts]
canidae = "canidae.cli:app"

[project.urls]
Homepage = "https://github.com/bennettek99-spec/canidgenomicspipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/canidae"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N803", "N806",  # allow uppercase math/statistic var names (K, N, F_ST)
    "B008",          # typer.Option(...) in argument defaults is the intended Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]  # test helper names

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that may invoke external tools",
    "slow: long-running tests",
]
